<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Almacén — Pedidos y Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&family=Sora:wght@600;700;800&family=Poppins:wght@400;600;800&family=Nunito:wght@400;700;800&family=Merriweather:wght@400;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#FBF6EC;
    --paper-2:#F4ECD9;
    --ink:#241F19;
    --ink-soft:#6B6459;
    --verde:#1E4D3A;
    --verde-dark:#163A2C;
    --verde-soft:#E7EFE9;
    --rojo:#C23B2E;
    --rojo-soft:#F6E3E0;
    --mostaza:#E0A32B;
    --mostaza-soft:#FBEFD3;
    --line:rgba(36,31,25,.12);
    --line-strong:rgba(36,31,25,.22);
    --shadow:0 1px 2px rgba(36,31,25,.06), 0 8px 24px rgba(36,31,25,.08);
    --radius:14px;
    --maxw:1180px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
  input[readonly],textarea[readonly]{opacity:.72;cursor:not-allowed}
  .linklike{background:none;color:var(--verde);font-weight:700;text-decoration:underline;padding:0;font-size:inherit}
  a{color:inherit}
  ::selection{background:var(--mostaza);color:var(--ink)}
  .mono{font-family:"Space Mono",monospace}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:var(--verde);color:#fff;border-bottom:3px solid var(--verde-dark)}
  .topbar-inner{max-width:var(--maxw);margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{width:44px;height:44px;border-radius:12px;background:var(--mostaza);color:var(--verde-dark);
    display:grid;place-items:center;font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;flex:none;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
  .brand-mark.has-logo{background:none!important;box-shadow:none!important;padding:0;overflow:hidden}
  .brand-mark.has-logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .brand-txt h1{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.02em}
  .brand-txt p{margin:1px 0 0;font-size:12px;color:rgba(255,255,255,.7);font-weight:500}
  .brand-hours{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.85);margin-top:3px;display:flex;align-items:center;gap:5px}
  .hdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
  [data-theme="moderno"] .brand-hours{color:var(--ink-soft)}
  [data-theme="boutique"] .brand-hours{color:var(--ink-soft)}
  .topbar-spacer{flex:1}
  .tabs{display:flex;gap:4px;background:rgba(0,0,0,.18);padding:4px;border-radius:11px}
  .tab{padding:8px 16px;border-radius:8px;font-weight:600;font-size:14px;color:rgba(255,255,255,.78);white-space:nowrap}
  .tab.active{background:var(--paper);color:var(--verde-dark)}
  .cart-btn{position:relative;display:flex;align-items:center;gap:9px;background:var(--mostaza);color:var(--verde-dark);
    padding:9px 15px;border-radius:11px;font-weight:700;font-size:14px}
  .cart-btn:hover{filter:brightness(.97)}
  .cart-badge{position:absolute;top:-7px;right:-7px;background:var(--rojo);color:#fff;min-width:20px;height:20px;
    border-radius:20px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--verde)}

  /* ---------- Layout ---------- */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:22px 18px 80px}
  .hero{background:linear-gradient(120deg,var(--verde) 0%,var(--verde-dark) 100%);color:#fff;border-radius:20px;
    padding:26px 28px;margin-bottom:22px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(224,163,43,.35),transparent 70%)}
  .hero h2{font-size:clamp(24px,4vw,36px);font-weight:800;max-width:640px;position:relative}
  .hero p{margin:8px 0 0;color:rgba(255,255,255,.82);max-width:560px;position:relative;font-size:15px}
  .hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative}
  .hero-tag{background:rgba(255,255,255,.14);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600}

  /* ---------- Controls ---------- */
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .search{flex:1;min-width:220px;position:relative}
  .search input{width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
  .search input:focus{border-color:var(--verde)}
  .search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.45}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .chip{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:22px;border:1.5px solid var(--line);
    background:#fff;font-weight:600;font-size:14px;white-space:nowrap;transition:.12s}
  .chip:hover{border-color:var(--line-strong)}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip .em{font-size:16px;line-height:1}

  /* ---------- Product grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.14s}
  .card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
  .card-top{height:120px;display:grid;place-items:center;font-size:52px;position:relative}
  .card-cat{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.85)}
  .card-body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card-name{font-weight:600;font-size:15px;line-height:1.25}
  .card-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.35;flex:1}
  .card-price{display:flex;align-items:baseline;gap:5px;margin-top:2px}
  .card-price .val{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px}
  .card-price .unit{font-size:12px;color:var(--ink-soft);font-weight:500}
  .card-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
  .qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .qty button{width:30px;height:34px;font-size:17px;font-weight:700;color:var(--verde);display:grid;place-items:center}
  .qty button:hover{background:var(--verde-soft)}
  .qty span{min-width:46px;text-align:center;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
  .add{flex:1;background:var(--verde);color:#fff;padding:0 12px;height:36px;border-radius:10px;font-weight:700;font-size:13.5px;
    display:flex;align-items:center;justify-content:center;gap:6px}
  .add:hover{background:var(--verde-dark)}
  .add.off{background:var(--paper-2);color:var(--ink-soft);cursor:not-allowed}
  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-soft)}
  .empty .big{font-size:40px;margin-bottom:8px}

  /* ---------- Drawer (cart) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(36,31,25,.5);z-index:60;opacity:0;pointer-events:none;transition:.2s}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:var(--paper);z-index:70;
    transform:translateX(100%);transition:.28s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
  .drawer.open{transform:none}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .drawer-head h3{font-size:19px;font-weight:800}
  .x{width:34px;height:34px;border-radius:10px;font-size:20px;color:var(--ink-soft)}
  .x:hover{background:var(--paper-2)}
  .drawer-body{flex:1;overflow-y:auto;padding:8px 20px}
  .drawer-foot{border-top:1px solid var(--line);padding:16px 20px;background:var(--paper)}
  .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .cart-item .em{font-size:30px;width:44px;height:44px;background:#fff;border-radius:10px;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
  .cart-item .info{flex:1;min-width:0}
  .cart-item .nm{font-weight:600;font-size:14px}
  .cart-item .meta{font-size:12.5px;color:var(--ink-soft)}
  .cart-item .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .cart-item .lt{font-weight:700;font-family:"Bricolage Grotesque";font-size:15px}
  .mini-qty{display:flex;align-items:center;gap:2px}
  .mini-qty button{width:26px;height:26px;border:1px solid var(--line);border-radius:7px;font-weight:700;color:var(--verde);display:grid;place-items:center}
  .mini-qty span{min-width:40px;text-align:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .link-del{font-size:12px;color:var(--rojo);font-weight:600}
  .sum-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
  .sum-row.total{font-size:18px;font-weight:800;font-family:"Bricolage Grotesque";padding-top:10px;margin-top:6px;border-top:1.5px dashed var(--line-strong)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:15px;transition:.12s}
  .btn-primary{background:var(--verde);color:#fff}
  .btn-primary:hover{background:var(--verde-dark)}
  .btn-primary:disabled{background:var(--paper-2);color:var(--ink-soft);cursor:not-allowed}
  .btn-ghost{background:#fff;border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--line-strong)}

  /* ---------- Forms ---------- */
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--verde)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg-opt{border:1.5px solid var(--line);border-radius:11px;padding:12px;text-align:center;font-weight:600;background:#fff;transition:.12s}
  .seg-opt small{display:block;font-weight:500;color:var(--ink-soft);font-size:11.5px;margin-top:2px}
  .seg-opt.active{border-color:var(--verde);background:var(--verde-soft)}
  .pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pay-opt{border:1.5px solid var(--line);border-radius:10px;padding:10px;font-weight:600;font-size:13.5px;background:#fff;display:flex;align-items:center;gap:8px}
  .pay-opt.active{border-color:var(--verde);background:var(--verde-soft)}

  /* ---------- Ticket ---------- */
  .ticket-wrap{text-align:center;padding:10px 0}
  .ticket{background:#fff;max-width:290px;margin:0 auto;border-radius:6px 6px 0 0;padding:24px 26px 30px;position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.12);border:1px solid var(--line)}
  .ticket::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:11px;
    background:radial-gradient(circle at 6px -1px, transparent 6px, #fff 6px) repeat-x;background-size:12px 12px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.05))}
  .ticket .kicker{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
  .ticket .num{font-family:"Space Mono";font-weight:700;font-size:64px;line-height:1;margin:6px 0;color:var(--verde)}
  .ticket .dash{border-top:2px dashed var(--line-strong);margin:14px 0}
  .ticket .rowt{display:flex;justify-content:space-between;font-size:13px;margin:5px 0;text-align:left}
  .ticket .rowt b{font-weight:700}
  .ticket .thanks{margin-top:12px;font-size:13px;color:var(--ink-soft)}

  /* ---------- Admin ---------- */
  .admin-lock{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;text-align:center}
  .admin-lock .em{font-size:44px}
  .admin-lock h3{font-size:22px;font-weight:800;margin:10px 0 4px}
  .admin-lock p{color:var(--ink-soft);font-size:14px;margin:0 0 18px}
  .admin-nav{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:5px;margin-bottom:20px;overflow-x:auto}
  .admin-nav button{padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:7px}
  .admin-nav button.active{background:var(--verde);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .kpi .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:6px}
  .kpi .num{font-family:"Bricolage Grotesque";font-weight:800;font-size:28px;margin-top:6px;letter-spacing:-.02em}
  .kpi .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px}
  .panel h3{font-size:17px;font-weight:800;margin-bottom:4px}
  .panel .ph-sub{color:var(--ink-soft);font-size:13px;margin-bottom:14px}
  .status-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .store-closed{background:var(--rojo-soft);color:var(--rojo);border:1.5px solid var(--rojo);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
  .store-open-pill{display:inline-flex;align-items:center;gap:6px;background:var(--verde-soft);color:var(--verde);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700;margin-bottom:14px}
  .sf{padding:8px 14px;border-radius:22px;border:1.5px solid var(--line);font-weight:600;font-size:13.5px;background:#fff;display:flex;align-items:center;gap:7px}
  .sf.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .sf .dot{width:8px;height:8px;border-radius:50%}
  .order{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:12px}
  .order-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .order-num{font-family:"Space Mono";font-weight:700;font-size:15px;background:var(--paper-2);padding:3px 9px;border-radius:8px}
  .badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;display:inline-flex;align-items:center;gap:5px}
  .order-cust{font-weight:600}
  .order-when{font-size:12.5px;color:var(--ink-soft);margin-left:auto}
  .order-items{margin:10px 0;padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);font-size:13.5px}
  .order-items .li{display:flex;justify-content:space-between;padding:2px 0}
  .order-items .li span:first-child{color:var(--ink-soft)}
  .order-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-bottom:12px}
  .order-meta b{color:var(--ink);font-weight:600}
  .order-actions{display:flex;gap:8px;flex-wrap:wrap}
  .act{padding:9px 15px;border-radius:10px;font-weight:700;font-size:13.5px;border:1.5px solid var(--line);background:#fff}
  .act.go{background:var(--verde);color:#fff;border-color:var(--verde)}
  .act.go:hover{background:var(--verde-dark)}
  .act.del{color:var(--rojo);border-color:var(--rojo-soft)}
  .act.del:hover{background:var(--rojo-soft)}

  /* products admin table */
  .ptable{width:100%;border-collapse:collapse;font-size:14px}
  .ptable th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:1.5px solid var(--line)}
  .ptable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .ptable tr:hover td{background:var(--paper)}
  .pill-toggle{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
  .pill-on{background:var(--verde-soft);color:var(--verde-dark)}
  .pill-off{background:var(--rojo-soft);color:var(--rojo)}
  .icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:15px}
  .icon-btn:hover{background:var(--paper)}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .chart-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .chart-box h4{font-size:14px;font-weight:700;margin-bottom:10px}
  .chart-box .cc{position:relative;height:230px}
  .rep-controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
  .rep-controls .field{margin:0}

  /* ---------- Modal ---------- */
  .modal-back{position:fixed;inset:0;background:rgba(36,31,25,.5);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-back.open{display:flex}
  .modal{background:var(--paper);border-radius:18px;width:min(460px,100%);max-height:90vh;overflow-y:auto;padding:24px}
  .modal h3{font-size:20px;font-weight:800;margin-bottom:16px}

  /* ---------- Toast ---------- */
  .toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;animation:pop .25s ease}
  @keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

  /* ================= TEMA MODERNO ================= */
  [data-theme="moderno"]{
    --paper:#F4F5FB;
    --paper-2:#E9EBF7;
    --ink:#14151F;
    --ink-soft:#71748A;
    --verde:#5B4BF5;         /* brand principal */
    --verde-dark:#4437D6;
    --verde-soft:#ECEBFE;
    --rojo:#F0476B;
    --rojo-soft:#FDE7EC;
    --mostaza:#12B7A3;       /* secundario teal */
    --mostaza-soft:#DEF6F2;
    --line:rgba(20,21,31,.09);
    --line-strong:rgba(20,21,31,.18);
    --shadow:0 1px 3px rgba(20,21,50,.06), 0 14px 34px rgba(20,21,50,.10);
    --radius:20px;
  }
  [data-theme="moderno"] h1,[data-theme="moderno"] h2,[data-theme="moderno"] h3,[data-theme="moderno"] h4{font-family:"Sora","Bricolage Grotesque",sans-serif}
  [data-theme="moderno"] .topbar{background:rgba(255,255,255,.72);color:var(--ink);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  [data-theme="moderno"] .brand-txt h1{color:var(--ink)}
  [data-theme="moderno"] .brand-txt p{color:var(--ink-soft)}
  [data-theme="moderno"] .brand-mark{background:linear-gradient(135deg,#6D5EFB,#4B7BFF);color:#fff;box-shadow:0 8px 18px rgba(91,75,245,.34)}
  [data-theme="moderno"] .tabs{background:var(--paper-2)}
  [data-theme="moderno"] .tab{color:var(--ink-soft)}
  [data-theme="moderno"] .tab.active{background:#fff;color:var(--verde);box-shadow:0 2px 8px rgba(20,21,50,.10)}
  [data-theme="moderno"] .cart-btn{background:linear-gradient(135deg,#6D5EFB,#4B7BFF);color:#fff;box-shadow:0 8px 18px rgba(91,75,245,.32)}

  /* ===== Promos ===== */
  .promo-strip{margin:2px 0 20px}
  .promo-strip .ph{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-family:"Bricolage Grotesque";font-weight:800;font-size:18px}
  .promo-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .promo-card{border:2px solid var(--mostaza);background:linear-gradient(180deg,var(--mostaza-soft),var(--paper));border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:5px}
  .promo-card .top{display:flex;align-items:center;justify-content:space-between}
  .promo-card .em{font-size:30px;line-height:1}
  .promo-badge{background:var(--rojo);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.05em}
  .promo-card .nm{font-family:"Bricolage Grotesque";font-weight:800;font-size:17px}
  .promo-card .ds{font-size:12.5px;color:var(--ink-soft)}
  .promo-card .its{list-style:none;margin:2px 0;padding:0;font-size:12.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px}
  .promo-card .pr{display:flex;align-items:baseline;gap:8px;margin-top:2px}
  .promo-card .pr .lista{text-decoration:line-through;color:var(--ink-soft);font-size:13px}
  .promo-card .pr .ahora{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;color:var(--verde)}
  .promo-card .save{font-size:12px;font-weight:700;color:var(--rojo)}
  .promo-card .add{margin-top:6px;background:var(--verde);color:#fff;border-radius:10px;padding:9px;font-weight:700}
  .promo-card .add:hover{filter:brightness(1.06)}
  .promo-card .qty{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px}
  .promo-card .qty button{width:28px;height:28px;border-radius:8px;background:var(--verde);color:#fff;font-size:18px;font-weight:700}

  /* ===== Botones 3D (opcional) ===== */
  [data-btn3d="on"] .btn,
  [data-btn3d="on"] .add,
  [data-btn3d="on"] .cart-btn,
  [data-btn3d="on"] .act{
    box-shadow:0 4px 0 rgba(0,0,0,.20);

  }
  [data-btn3d="on"] .btn:active,
  [data-btn3d="on"] .add:active,
  [data-btn3d="on"] .cart-btn:active,
  [data-btn3d="on"] .act:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.20); }
  [data-btn3d="on"] .btn-ghost{box-shadow:0 4px 0 var(--line-strong)}
  [data-btn3d="on"] .btn-ghost:active{box-shadow:0 1px 0 var(--line-strong)}

  /* ===== Personalización (Diseño) ===== */

/* ---- Estado abierto/cerrado ---- */
function tiendaAbierta(){
  if(CONFIG.cerradoManual)return false;
  const now=new Date(); const h=(CONFIG.horarios||[])[now.getDay()];
  if(!h||!h.abierto)return false;
  const cur=now.getHours()*60+now.getMinutes();
  const toMin=t=>{const[a,b]=String(t||'0:0').split(':').map(Number);return (a||0)*60+(b||0);};
  return cur>=toMin(h.desde) && cur<=toMin(h.hasta);
}
function proximaApertura(){
  const now=new Date(); const cur=now.getHours()*60+now.getMinutes();
  const toMin=t=>{const[a,b]=String(t||'0:0').split(':').map(Number);return (a||0)*60+(b||0);};
  for(let i=0;i<8;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const h=(CONFIG.horarios||[])[d.getDay()];
    if(h&&h.abierto){
      if(i===0){ if(cur<toMin(h.desde)) return 'hoy a las '+h.desde; else continue; }
      return (i===1?'mañana':h.d.toLowerCase())+' a las '+h.desde;
    }
  }
  return '';
}

/* ============================================================
   NUBE (Supabase) — Fase 1: leer catálogo/config + crear pedido
   ============================================================ */
async function cloudLoad(){
  if(!cloudEnabled())return false;
  const T=(t,q)=>sb.from(t).select('*');
  const [cfg,cats,pagos,envios,estados,prods,promos,pitems]=await Promise.all([
    sb.from('config').select('*').eq('id',1).maybeSingle(),
    sb.from('categorias').select('*').order('orden'),
    sb.from('formas_pago').select('*').order('orden'),
    sb.from('tipos_envio').select('*').order('orden'),
    sb.from('estados_pedido').select('*').order('orden'),
    sb.from('productos').select('*').order('orden'),
    sb.from('promos').select('*').order('orden'),
    sb.from('promo_items').select('*'),
  ]);
  const err = cfg.error||cats.error||pagos.error||envios.error||estados.error||prods.error||promos.error||pitems.error;
  if(err || !cfg.data){ console.warn('cloudLoad:', err||'sin config'); return false; }

  const c=cfg.data;
  CONFIG.nombre=c.nombre; CONFIG.marca=c.marca; CONFIG.sub=c.sub;
  CONFIG.heroTit=c.hero_titulo; CONFIG.heroTxt=c.hero_texto;
  CONFIG.heroTags=c.hero_tags||[]; CONFIG.logo=c.logo||'';
  CONFIG.cerradoManual=!!c.cerrado_manual; CONFIG.horarios=c.horarios||[];
  CONFIG.ui=Object.assign({}, c.ui||{});
  CONFIG.cats={}; (cats.data||[]).forEach(r=>CONFIG.cats[r.id]={nom:r.nombre,em:r.emoji,color:r.color});
  CONFIG.pagos=(pagos.data||[]).map(r=>({id:r.id,nom:r.nombre,em:r.emoji}));
  CONFIG.envios=(envios.data||[]).map(r=>({id:r.id,nom:r.nombre,desc:r.descripcion,costo:Number(r.costo)||0,em:r.emoji,pideDir:!!r.pide_dir}));
  CONFIG.estados=(estados.data||[]).filter(r=>r.id!=='cancelado').map(r=>({id:r.id,nom:r.nombre,color:r.color}));
  CONFIG.promos=(promos.data||[]).map(pr=>({id:pr.id,nombre:pr.nombre,em:pr.emoji,desc:pr.descripcion,precio:Number(pr.precio)||0,activo:pr.activo!==false,
     items:(pitems.data||[]).filter(x=>x.promo_id===pr.id).map(x=>({id:x.producto_id,qty:Number(x.cantidad)||1}))}));
  PRODUCTS=(prods.data||[]).map(r=>({id:r.id,nombre:r.nombre,cat:r.categoria_id,precio:Number(r.precio)||0,unidad:r.unidad,em:r.emoji,desc:r.descripcion,activo:r.activo!==false}));
  normalizeConfig();
  return true;
}
async function sbCrearPedido(co,env,items){
  const p_items=items.map(i=>({producto_id:i.id,nombre:i.nombre,unidad:i.unidad,precio:i.precio,qty:i.qty,es_promo:!!i.esPromo}));
  const {data,error}=await sb.rpc('crear_pedido',{
    p_nombre:(co.nombre||'').trim(), p_tel:(co.tel||'').trim(),
    p_dir:env.pideDir?(co.dir||'').trim():'',
    p_tipo:co.tipo, p_pago:co.pago, p_nota:(co.nota||'').trim(), p_items
  });
  if(error) throw error;
  return data; // número de pedido (n)
}

const outCat    = (id,c,i)=>({id, nombre:c.nom, emoji:c.em, color:c.color, orden:i});
const outPago   = (p,i)=>({id:p.id, nombre:p.nom, emoji:p.em, orden:i});
const outEnvio  = (e,i)=>({id:e.id, nombre:e.nom, descripcion:e.desc||'', costo:Number(e.costo)||0, emoji:e.em, pide_dir:!!e.pideDir, orden:i});
const outEstado = (e,i)=>({id:e.id, nombre:e.nom, color:e.color, orden:i});

const outPromo  = (pr,i)=>({id:pr.id, nombre:pr.nombre, emoji:pr.em, descripcion:pr.desc||'', precio:Number(pr.precio)||0, activo:pr.activo!==false, orden:i});
const outCliente= (c)=>({id:c.id, nombre:c.nombre, tel:c.tel||'', dir:c.dir||'', email:c.email||'', nota:c.nota||''});

async function sbUpsert(table,rows,onConflict){
  if(!cloudStaff()||!rows||(Array.isArray(rows)&&!rows.length))return;
  try{ const {error}=await sb.from(table).upsert(rows, onConflict?{onConflict}:undefined); if(error)console.warn('upsert',table,error.message);}catch(e){console.warn('upsert',table,e);}
}
async function sbDelete(table,col,val){
  if(!cloudStaff())return;
  try{ const {error}=await sb.from(table).delete().eq(col,val); if(error)console.warn('delete',table,error.message);}catch(e){console.warn('delete',table,e);}
}
let _pushT=null;
function cloudPushDebounced(){ if(!cloudStaff())return; clearTimeout(_pushT); _pushT=setTimeout(cloudPushAll,700); }
async function cloudPushAll(){
  if(!cloudStaff())return;
  const c=CONFIG;
  await sbUpsert('config',{id:1,nombre:c.nombre,marca:c.marca,sub:c.sub,hero_titulo:c.heroTit,hero_texto:c.heroTxt,hero_tags:c.heroTags||[],logo:c.logo||'',cerrado_manual:!!c.cerradoManual,horarios:c.horarios||[],ui:c.ui||{}},'id');
  await sbUpsert('categorias',Object.entries(CONFIG.cats).map(([id,x],i)=>outCat(id,x,i)),'id');
  await sbUpsert('formas_pago',CONFIG.pagos.map(outPago),'id');
  await sbUpsert('tipos_envio',CONFIG.envios.map(outEnvio),'id');
  await sbUpsert('estados_pedido',CONFIG.estados.map(outEstado),'id');
  await sbUpsert('productos',PRODUCTS.map(outProd),'id');
  await sbUpsert('promos',(CONFIG.promos||[]).map(outPromo),'id');
  const pis=[]; (CONFIG.promos||[]).forEach(pr=>(pr.items||[]).forEach(it=>pis.push({promo_id:pr.id,producto_id:it.id,cantidad:Number(it.qty)||1})));
  await sbUpsert('promo_items',pis,'promo_id,producto_id');
  await sbUpsert('clientes',CLIENTES.map(outCliente),'id');
}
async function sbSetEstadoCloud(n,estado){ if(!cloudStaff())return; try{const {error}=await sb.from('pedidos').update({estado}).eq('n',n); if(error)console.warn(error.message);}catch(e){console.warn(e);} }

async function _fetchPedidos(limit){
  const {data:peds,error}=await sb.from('pedidos').select('*').order('ts',{ascending:false}).limit(limit||500);
  if(error){console.warn(error.message);return [];}
  const ns=(peds||[]).map(p=>p.n); let items=[];
  if(ns.length){ const r=await sb.from('pedido_items').select('*').in('pedido_n',ns); items=r.data||[]; }
  return (peds||[]).map(p=>({
    n:p.n, ts:p.ts, cliente:{nombre:p.cliente_nombre,tel:p.cliente_tel,dir:p.cliente_dir},

async function restaurarSesion(){
  if(!cloudEnabled())return;
  const perfil=await getMiPerfil(); if(!perfil)return;
  if(['admin','empleado'].includes(perfil.rol)){
    state.admin.auth=true; state.admin.user=perfil;

    state.checkout.nombre=perfil.nombre||''; state.checkout.tel=perfil.tel||'';

  }

function suscribirPedidos(){
  if(!cloudEnabled()||_canal)return;
  try{
    _canal=sb.channel('pedidos-panel')
      .on('postgres_changes',{event:'*',schema:'public',table:'pedidos'}, async (payload)=>{
        await cargarPedidosCloud();
        if(state.admin.auth && state.admin.tab==='pedidos') renderAdmin();
        if(payload && payload.eventType==='INSERT') toast('🔔 ¡Nuevo pedido!');
      }).subscribe();
  }catch(e){console.warn(e);}
}
function desuscribirPedidos(){ try{ if(_canal){sb.removeChannel(_canal);_canal=null;} }catch(e){} }
function suscribirMisPedidos(uid){
  if(!cloudEnabled()||_canal||!uid)return;
  try{
    _canal=sb.channel('mis-pedidos')
      .on('postgres_changes',{event:'*',schema:'public',table:'pedidos',filter:'cliente_uid=eq.'+uid}, async ()=>{
        await cargarMisPedidosCloud();
        if(state.admin.auth && (state.admin.user||{}).rol==='cliente') renderAdmin();

/* ============================================================
   Helpers
   ============================================================ */
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.innerHTML=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2200);
}
const prodById = id => PRODUCTS.find(p=>p.id===id);
function cartCount(){return Object.keys(state.cart).length + Object.keys(state.promoCart||{}).length;}
function cartSubtotal(){
  const prod=Object.entries(state.cart).reduce((s,[id,q])=>{const p=prodById(id);return s+(p?p.precio*q:0);},0);
  const prom=Object.entries(state.promoCart||{}).reduce((s,[id,q])=>{const pr=promoById(id);return s+(pr?pr.precio*q:0);},0);
  return prod+prom;
}
function fmtFecha(ts){
  const d=new Date(ts);
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
}

function detalleCtrl(p){
  if(!p.activo) return `<div class="empty" style="padding:10px">😕 Sin stock por ahora.</div>`;
  const u=UNIDADES[p.unidad]||UNIDADES.un; const q=state.cart[p.id]||0;
  return q
    ? `<div class="mini-qty" style="justify-content:center;font-size:16px">
         <button onclick="pdStep('${p.id}',-1)">−</button><span>${u.fmt(q)}</span><button onclick="pdStep('${p.id}',1)">＋</button>
         <span style="margin-left:12px;font-weight:800">${money(p.precio*q)}</span>
       </div>
       <button class="btn btn-primary" style="margin-top:10px" onclick="openCart();cerrarModal()">Ver mi pedido →</button>`
    : `<button class="btn btn-primary" onclick="pdStep('${p.id}',1)">＋ Agregar al pedido</button>`;
}
function pdStep(id,dir){
  if(dir>0 && !state.cart[id]) addToCart(id); else stepCart(id,dir);
  const p=prodById(id); const el=document.getElementById('pdCtrls');
  if(el && p) el.innerHTML=detalleCtrl(p);
}
function addToCart(id){
  const p=prodById(id);const u=UNIDADES[p.unidad];
  state.cart[id]=(state.cart[id]||0)+u.min;
  refreshCartUI();renderProducts();
  toast(`✓ ${p.nombre} agregado`);
}
function stepCart(id,dir){
  const p=prodById(id);const u=UNIDADES[p.unidad];
  let q=(state.cart[id]||0)+dir*u.step;
  q=Math.round(q*100)/100;
  if(q<u.min){delete state.cart[id];} else {state.cart[id]=q;}
  refreshCartUI();renderProducts();
  if(state.view==='store' && document.getElementById('drawer').classList.contains('open')) renderCart();
}
function removeFromCart(id){delete state.cart[id];refreshCartUI();renderProducts();renderCart();}

  const its=(pr.items||[]).map(it=>{const p=prodById(it.id);return p?`<li>${(UNIDADES[p.unidad]||UNIDADES.un).fmt(it.qty)} · ${esc(p.nombre)}</li>`:'';}).join('');
  return `<div class="promo-card">

    <div class="pr">${lista>pr.precio?`<span class="lista">${money(lista)}</span>`:''}<span class="ahora">${money(pr.precio)}</span></div>
    ${ahorro>0?`<div class="save">Ahorrás ${money(ahorro)}</div>`:''}
    ${q?`<div class="qty"><button onclick="stepPromo('${pr.id}',-1)">−</button><span>${q} combo${q>1?'s':''}</span><button onclick="stepPromo('${pr.id}',1)">+</button></div>`

function addPromo(id){const pr=promoById(id);if(!pr)return;if(!state.promoCart)state.promoCart={};state.promoCart[id]=(state.promoCart[id]||0)+1;refreshCartUI();renderProducts();toast(`✓ ${pr.nombre} agregado`);}
function stepPromo(id,dir){if(!state.promoCart)state.promoCart={};let q=(state.promoCart[id]||0)+dir;if(q<1)delete state.promoCart[id];else state.promoCart[id]=q;refreshCartUI();renderProducts();if(document.getElementById('drawer').classList.contains('open'))renderCart();}
function removePromo(id){delete (state.promoCart||{})[id];refreshCartUI();renderProducts();renderCart();}

}

async function confirmarPedido(){
  if(!tiendaAbierta()){toast('🔒 La tienda está cerrada ahora');return;}
  grabCheckout();
  const co=state.checkout;
  const cu=clienteLogueado();
  if(cu){ co.nombre=cu.nombre||co.nombre; co.tel=cu.tel||co.tel; }
  const env=envioById(co.tipo);
  if(!co.nombre||!co.nombre.trim()){toast('⚠ Poné tu nombre');return;}
  if(!co.tel||!co.tel.trim()){toast('⚠ Falta el teléfono');return;}
  if(env.pideDir&&(!co.dir||!co.dir.trim())){toast('⚠ Falta la dirección de entrega');return;}

  const prodItems=Object.entries(state.cart).map(([id,q])=>{const p=prodById(id);return {id,nombre:p.nombre,unidad:p.unidad,precio:p.precio,qty:q};});
  const promoItems=Object.entries(state.promoCart||{}).map(([id,q])=>{const pr=promoById(id);return pr?{id:pr.id,nombre:'Promo: '+pr.nombre,unidad:'un',precio:pr.precio,qty:q,esPromo:true,componentes:pr.items}:null;}).filter(Boolean);
  const items=[...prodItems,...promoItems];
  if(!items.length){toast('⚠ El pedido está vacío');return;}

  let n;
  if(cloudEnabled()){
    try{ n = await sbCrearPedido(co, env, items); }
    catch(e){ console.error(e); toast('⚠ No se pudo enviar el pedido a la nube'); return; }
  } else {
    n = ++ORDER_SEQ;
  }

  const order={
    n, ts:new Date().toISOString(),
    cliente:{nombre:co.nombre.trim(),tel:co.tel.trim(),dir:env.pideDir?co.dir.trim():''},
    tipo:co.tipo, pago:co.pago, nota:(co.nota||'').trim(),
    estado:(CONFIG.estados[0]||{id:'pendiente'}).id, items
  };
  ORDERS.unshift(order);
  upsertClienteDesdePedido(order);
  state.cart={}; state.promoCart={}; refreshCartUI(); renderProducts();
  if(!cloudEnabled()) save();
  mostrarTicket(order);
}

function upsertClienteDesdePedido(o){
  const tel=(o.cliente.tel||'').trim(); if(!tel)return;
  let c=CLIENTES.find(x=>(x.tel||'').trim()===tel);
  if(c){ c.nombre=o.cliente.nombre||c.nombre; if(o.cliente.dir)c.dir=o.cliente.dir; }
  else { CLIENTES.push({id:uid('c'),nombre:o.cliente.nombre,tel,dir:o.cliente.dir||'',email:'',nota:''}); }
}

function mostrarTicket(order){

function whatsappPedido(n){
  const o=ORDERS.find(x=>x.n===n); if(!o)return;
  const env=envioById(o.tipo);
  const total=o.items.reduce((s,i)=>s+i.precio*i.qty,0)+(env.costo||0);
  let t=`*Pedido N° ${String(o.n).padStart(3,'0')} — ${CONFIG.nombre}*%0A%0A`;
  t+=`*${o.cliente.nombre}* (${o.cliente.tel})%0A`;
  t+=env.pideDir?`${env.nom} a: ${o.cliente.dir}%0A`:`${env.nom} — retira en el local%0A`;
  t+=`%0A`;
  o.items.forEach(i=>{t+=`• ${i.nombre} — ${(UNIDADES[i.unidad]||UNIDADES.un).fmt(i.qty)} — ${money(i.precio*i.qty)}%0A`;});
  if(env.costo>0)t+=`• ${env.nom} — ${money(env.costo)}%0A`;
  t+=`%0A*Total: ${money(total)}*%0APago: ${pagoLabel(o.pago)}`;
  if(o.nota)t+=`%0ANota: ${o.nota}`;
  window.open(`https://wa.me/?text=${t}`,'_blank');
}

async function doRegister(){
  if(cloudEnabled()){

    try{

function repetirPedido(n){
  const o=ORDERS.find(x=>x.n===n); if(!o)return;
  state.cart={}; state.promoCart={};
  let faltan=0;
  (o.items||[]).forEach(it=>{
    if(it.esPromo || promoById(it.id)){
      if(promoById(it.id)) state.promoCart[it.id]=(state.promoCart[it.id]||0)+it.qty; else faltan++;
      return;
    }
    const p=prodById(it.id);
    if(p && p.activo){ state.cart[it.id]=(state.cart[it.id]||0)+it.qty; } else faltan++;
  });
  state.checkout.nombre=o.cliente.nombre; state.checkout.tel=o.cliente.tel;
  state.checkout.dir=o.cliente.dir||''; state.checkout.tipo=o.tipo; state.checkout.pago=o.pago;
  refreshCartUI(); setView('store'); renderProducts(); openCart();
  toast(faltan?('Pedido cargado. '+faltan+' ítem(s) ya no están disponibles.'):'✓ Pedido cargado en el carrito');
}

function avisarEstado(n){
  const o=ORDERS.find(x=>x.n===n); if(!o)return;
  const e=estadoById(o.estado); const env=envioById(o.tipo);
  const nn=String(o.n).padStart(3,'0'); const nombre=(o.cliente.nombre||'').split(' ')[0];
  let msg;
  if(/listo/i.test(e.nom)) msg = env.pideDir ? `¡Hola ${nombre}! Tu pedido N° ${nn} de ${CONFIG.nombre} ya está listo y sale para tu domicilio 🛵` : `¡Hola ${nombre}! Tu pedido N° ${nn} de ${CONFIG.nombre} ya está listo para retirar 🛍️`;
  else msg = `¡Hola ${nombre}! Novedad de tu pedido N° ${nn} de ${CONFIG.nombre}: ${e.nom}.`;
  const tel=telWa(o.cliente.tel);
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
}

function subirLogo(input){

function setTheme(id){

function effectiveThemeId(){
  const ad=(CONFIG.ui||{}).autoDark||'off';
  if(ad==='system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) return 'nocturno';
  if(ad==='night'){ const hh=new Date().getHours(); if(hh>=19||hh<7) return 'nocturno'; }
  return state.theme;
}
function applyTheme(){
  const t=themeById(effectiveThemeId());
  document.documentElement.setAttribute('data-theme', t.id==='clasico'?'':t.id);
  if(window.Chart){                    // gráficos legibles según tema claro/oscuro
    Chart.defaults.color=t.pal.txt;
    Chart.defaults.borderColor=t.pal.grid;
  }
  applyUI();
}
function applyUI(){
  const ui=(CONFIG.ui||{});
  document.documentElement.setAttribute('data-btn3d', ui.btn3d?'on':'off');
  let el=document.getElementById('uiOverrides');
  if(!el){el=document.createElement('style');el.id='uiOverrides';document.head.appendChild(el);}
  let css='';
  if(ui.bgApp)    css+=`body{background:${ui.bgApp}!important}`;
  if(ui.bgCard)   css+=`.card{background:${ui.bgCard}!important}.card-body{background:transparent!important}`;
  if(ui.bgPedido) css+=`.order{background:${ui.bgPedido}!important}`;
  if(ui.bgPanel)  css+=`.panel{background:${ui.bgPanel}!important}`;
  // Tipografía
  if(ui.font && FONTS[ui.font] && FONTS[ui.font].body){
    css+=`body,button,input,select,textarea,.btn,.add,.chip{font-family:${FONTS[ui.font].body}!important}`;
    css+=`h1,h2,h3,h4,.brand-txt h1,.card-name,.num{font-family:${FONTS[ui.font].head}!important}`;
  }
  // Color de texto (variable inline: gana sobre el tema)
  if(ui.textColor){ document.documentElement.style.setProperty('--ink', ui.textColor); }
  else { document.documentElement.style.removeProperty('--ink'); }
  // Tamaño del nombre del almacén
  if(ui.nameSize){ css+=`.brand-txt h1{font-size:${ui.nameSize}px!important}`; }
  // Colores de botones diferenciados
  if(ui.btnPrimary){ css+=`.btn-primary{background:${ui.btnPrimary}!important;border-color:${ui.btnPrimary}!important;color:${idealText(ui.btnPrimary)}!important}`; }
  if(ui.btnAdd){ css+=`.add{background:${ui.btnAdd}!important;color:${idealText(ui.btnAdd)}!important}`; }
  if(ui.btnCart){ css+=`.cart-btn{background:${ui.btnCart}!important;color:${idealText(ui.btnCart)}!important}`; }
  el.textContent=css;
}

function aplicarRep(){state.rep.desde=document.getElementById('repDesde').value;state.rep.hasta=document.getElementById('repHasta').value;computeAndRender();}

function periodoOrders(){
  const d=new Date(state.rep.desde+'T00:00:00');
  const h=new Date(state.rep.hasta+'T23:59:59');
  return ORDERS.filter(o=>o.estado!=='cancelado').filter(o=>{const t=new Date(o.ts);return t>=d&&t<=h;});
}
function orderTotal(o){return o.items.reduce((s,i)=>s+i.precio*i.qty,0)+envioCosto(o);}

function computeAndRender(){
  const pal=themePalette();
  const os=periodoOrders();
  const fact=os.reduce((s,o)=>s+orderTotal(o),0);
  const cant=os.length;
  const ticket=cant?fact/cant:0;
  let unidades=0;os.forEach(o=>o.items.forEach(i=>unidades+=i.qty));

  document.getElementById('repKpis').innerHTML=`
    ${kpi('💵 Facturado',money(fact),cant+' pedidos')}
    ${kpi('🧾 Ticket promedio',money(ticket),'')}
    ${kpi('📦 Pedidos',cant,'entregados + en curso')}
    ${kpi('⚖️ Ítems vendidos',unidades.toFixed(2).replace('.',','),'unidades / kg')}`;

  // Por día
  const porDia={};
  os.forEach(o=>{const k=o.ts.slice(0,10);porDia[k]=(porDia[k]||0)+orderTotal(o);});
  const dias=Object.keys(porDia).sort();
  drawChart('chDias','bar',{
    labels:dias.map(d=>d.slice(8,10)+'/'+d.slice(5,7)),
    datasets:[{label:'$',data:dias.map(d=>porDia[d]),backgroundColor:pal.bar,borderRadius:6}]
  },{plugins:{legend:{display:false}}});

  // Por rubro
  const porRubro={};
  os.forEach(o=>o.items.forEach(i=>{const pr=prodById(i.id);const c=pr?pr.cat:'otros';porRubro[c]=(porRubro[c]||0)+i.precio*i.qty;}));
  const rk=Object.keys(porRubro);
  drawChart('chRubros','bar',{
    labels:rk.map(k=>catById(k).nom),
    datasets:[{data:rk.map(k=>porRubro[k]),backgroundColor:pal.set,borderRadius:6}]
  },{indexAxis:'y',plugins:{legend:{display:false}}});

  // Tipo de envío
  const tk={};CONFIG.envios.forEach(e=>tk[e.id]=0);os.forEach(o=>{tk[o.tipo]=(tk[o.tipo]||0)+1;});
  const tkKeys=Object.keys(tk).filter(k=>tk[k]>0);
  drawChart('chTipo','doughnut',{
    labels:tkKeys.map(k=>envioById(k).nom),
    datasets:[{data:tkKeys.map(k=>tk[k]),backgroundColor:pal.d4}]
  },{cutout:'62%'});

  // Pago
  const pk={};os.forEach(o=>pk[o.pago]=(pk[o.pago]||0)+1);
  const pks=Object.keys(pk);
  drawChart('chPago','doughnut',{
    labels:pks.map(pagoLabel),
    datasets:[{data:pks.map(k=>pk[k]),backgroundColor:pal.d4}]
  },{cutout:'62%'});

  // Top productos
  const top={};
  os.forEach(o=>o.items.forEach(i=>{if(!top[i.id])top[i.id]={nombre:i.nombre,em:(prodById(i.id)||{em:'📦'}).em,qty:0,monto:0,unidad:i.unidad};top[i.id].qty+=i.qty;top[i.id].monto+=i.precio*i.qty;}));
  const arr=Object.values(top).sort((a,b)=>b.monto-a.monto).slice(0,8);
  const max=arr.length?arr[0].monto:1;
  document.getElementById('topProd').innerHTML=arr.length?arr.map(p=>`
    <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)">
      <span style="font-size:22px">${p.em}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600">${p.nombre}</div>
        <div style="height:6px;background:var(--paper-2);border-radius:6px;margin-top:5px;overflow:hidden"><div style="height:100%;width:${(p.monto/max*100)}%;background:var(--verde);border-radius:6px"></div></div>
      </div>
      <div style="text-align:right"><b>${money(p.monto)}</b><div style="font-size:12px;color:var(--ink-soft)">${UNIDADES[p.unidad].fmt(p.qty)}</div></div>
    </div>`).join(''):'<div class="empty">Sin ventas en el período.</div>';
}
function kpi(lbl,num,sub){return `<div class="kpi"><div class="lbl">${lbl}</div><div class="num">${num}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;}
function drawChart(id,type,data,opts){
  const el=document.getElementById(id);if(!el)return;
  if(charts[id])charts[id].destroy();
  charts[id]=new Chart(el,{type,data,options:Object.assign({
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{font:{family:'Instrument Sans'},boxWidth:12,padding:10}}},
    scales:type==='doughnut'?{}:{y:{ticks:{callback:v=>'$'+(v>=1000?(v/1000)+'k':v)}},x:{grid:{display:false}}}
  },opts||{})});
}

function exportarCSV(){
  const os=periodoOrders();
  let rows=[['N°','Fecha','Cliente','Tel','Tipo','Direccion','Pago','Estado','Item','Cantidad','Unidad','PrecioUnit','SubtotalItem']];
  os.forEach(o=>o.items.forEach(i=>{
    rows.push([o.n,fmtFecha(o.ts),o.cliente.nombre,o.cliente.tel,envioById(o.tipo).nom,o.cliente.dir||'',pagoLabel(o.pago),estadoById(o.estado).nom,i.nombre,String(i.qty).replace('.',','),i.unidad,i.precio,i.precio*i.qty]);
  }));
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`ventas_${state.rep.desde}_a_${state.rep.hasta}.csv`;a.click();
  toast('⬇ CSV exportado');
}

/* ============================================================
   EDITAR PEDIDO (sin stock / cambiar producto)
   ============================================================ */
function editarPedido(n){
  const o=ORDERS.find(x=>x.n===n); if(!o)return;
  state.edit={n, tipo:o.tipo, items:o.items.map(i=>Object.assign({},i))};
  edRender();
}
function edRender(){
  const e=state.edit; if(!e)return;
  const opts=selId=>PRODUCTS.filter(pr=>pr.activo||pr.id===selId)
    .map(pr=>`<option value="${pr.id}" ${pr.id===selId?'selected':''}>${pr.em} ${esc(pr.nombre)} — ${money(pr.precio)}</option>`).join('');
  const rows=e.items.map((it,idx)=>{
    const u=UNIDADES[it.unidad]||UNIDADES.un;
    return `<div class="list-row" style="align-items:flex-start">
      <div class="grow">
        <select onchange="edSwap(${idx},this.value)" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper-2);color:var(--ink)">${opts(it.id)}</select>
        <div class="mini-qty" style="margin-top:8px">
          <button onclick="edStep(${idx},-1)">−</button>
          <span>${u.fmt(it.qty)}</span>
          <button onclick="edStep(${idx},1)">＋</button>
          <span style="margin-left:10px;font-weight:700">${money(it.precio*it.qty)}</span>
          <button class="link-del" style="margin-left:auto" onclick="edDel(${idx})">Quitar</button>
        </div>
      </div>
    </div>`;
  }).join('');
  const sub=e.items.reduce((s,i)=>s+i.precio*i.qty,0);
  const env=envioById(e.tipo).costo||0;
  const addOpts=PRODUCTS.filter(pr=>pr.activo).map(pr=>`<option value="${pr.id}">${pr.em} ${esc(pr.nombre)} — ${money(pr.precio)}</option>`).join('');
  openModal(`
    <h3>Editar pedido N° ${String(e.n).padStart(3,'0')}</h3>
    <div class="ph-sub">Cambiá cantidades, quitá o reemplazá productos si no hay stock.</div>
    <div class="field"><label>Tipo de envío</label>
      <select id="edTipo" onchange="edSetTipo(this.value)">${CONFIG.envios.map(x=>`<option value="${x.id}" ${x.id===e.tipo?'selected':''}>${x.em||''} ${esc(x.nom)}${x.costo>0?' (+'+money(x.costo)+')':''}</option>`).join('')}</select>
    </div>
    <div style="max-height:38vh;overflow:auto;margin-bottom:10px">${rows||'<div class="empty">El pedido quedó sin ítems.</div>'}</div>
    <div class="field"><label>Agregar producto</label>
      <div style="display:flex;gap:8px">
        <select id="edAddSel" style="flex:1;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper-2);color:var(--ink)">${addOpts}</select>
        <button class="btn btn-ghost" style="width:auto;padding:0 16px" onclick="edAdd()">＋</button>
      </div>
    </div>
    <div class="sum-row"><span>Subtotal</span><b>${money(sub)}</b></div>
    ${env?`<div class="sum-row"><span>${esc(envioById(e.tipo).nom)}</span><b>${money(env)}</b></div>`:''}
    <div class="sum-row total"><span>Total</span><span>${money(sub+env)}</span></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-ghost" onclick="state.edit=null;cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarEdicion()">Guardar cambios</button>
    </div>
  `,true);
}
function edStep(idx,dir){
  const it=state.edit.items[idx],u=UNIDADES[it.unidad]||UNIDADES.un;
  let q=Math.round(((it.qty||0)+dir*u.step)*100)/100;
  if(q<u.min)q=u.min; it.qty=q; edRender();
}
function edDel(idx){state.edit.items.splice(idx,1);edRender();}
function edSwap(idx,pid){
  const pr=prodById(pid); if(!pr)return;
  const it=state.edit.items[idx],u=UNIDADES[pr.unidad]||UNIDADES.un;
  it.id=pr.id;it.nombre=pr.nombre;it.precio=pr.precio;it.unidad=pr.unidad;
  if(it.qty<u.min)it.qty=u.min;
  edRender();
}
function edSetTipo(t){state.edit.tipo=t;edRender();}
function edAdd(){
  const pid=val('edAddSel');const pr=prodById(pid);if(!pr)return;
  const u=UNIDADES[pr.unidad]||UNIDADES.un;
  const ex=state.edit.items.find(i=>i.id===pid);
  if(ex){ex.qty=Math.round((ex.qty+u.step)*100)/100;}
  else{state.edit.items.push({id:pr.id,nombre:pr.nombre,unidad:pr.unidad,precio:pr.precio,qty:u.min});}
  edRender();
}
function guardarEdicion(){
  const e=state.edit;if(!e)return;
  if(!e.items.length){toast('⚠ El pedido no puede quedar vacío. Cancelalo si corresponde.');return;}
  const o=ORDERS.find(x=>x.n===e.n);if(!o)return;
  o.items=e.items.map(i=>Object.assign({},i));o.tipo=e.tipo;
  if(!envioById(e.tipo).pideDir)o.cliente.dir='';
  state.edit=null;cerrarModal();save();renderAdmin();
  toast('✓ Pedido N° '+String(e.n).padStart(3,'0')+' actualizado');
}

  }

      <span style="font-size:20px">${e.em||'📦'}</span>
      <div class="grow"><b>${esc(e.nom)}</b> <span class="hint">· ${e.costo>0?money(e.costo):'sin cargo'}${e.pideDir?' · pide dirección':''}</span></div>
      <button class="icon-btn" onclick="editEnvio(${i})" title="Editar">✏️</button>
      <button class="icon-btn" onclick="borrarItem('envios',${i})" title="Borrar">🗑️</button>
    </div>`).join('');
    return panelCfg('Tipos de envío','Cómo recibe el pedido el cliente (retiro, delivery, etc.).','editEnvio(null)',rows);
  }
  if(t==='estados'){
    const rows=CONFIG.estados.map((e,i)=>`<div class="list-row">
      <span class="swatch" style="background:${e.color}"></span>
      <div class="grow"><b>${esc(e.nom)}</b> <span class="hint">· paso ${i+1}${i===0?' (inicial)':''}</span></div>
      <button class="icon-btn" onclick="moverEstado(${i},-1)" title="Subir" ${i===0?'disabled':''}>↑</button>
      <button class="icon-btn" onclick="moverEstado(${i},1)" title="Bajar" ${i===CONFIG.estados.length-1?'disabled':''}>↓</button>
      <button class="icon-btn" onclick="editEstado(${i})" title="Editar">✏️</button>
      <button class="icon-btn" onclick="borrarItem('estados',${i})" title="Borrar">🗑️</button>
    </div>`).join('');
    return panelCfg('Estados del pedido','El pedido avanza en este orden. «'+esc((CONFIG.estados[0]||{}).nom||'')+'» es el inicial y «Cancelado» es fijo.','editEstado(null)',rows);
  }

function borrarItem(arr,i){
  if(arr==='estados'&&CONFIG.estados.length<=1){toast('⚠ Tiene que quedar al menos un estado');return;}
  if(arr==='pagos'&&CONFIG.pagos.length<=1){toast('⚠ Dejá al menos una forma de pago');return;}
  if(arr==='envios'&&CONFIG.envios.length<=1){toast('⚠ Dejá al menos un tipo de envío');return;}
  const it=CONFIG[arr][i]; if(!it)return;
  if(!confirm('¿Borrar "'+(it.nom||'')+'"?'))return;
  const _tbl={pagos:'formas_pago',envios:'tipos_envio',estados:'estados_pedido'}[arr];
  CONFIG[arr].splice(i,1); if(cloudStaff()&&_tbl)sbDelete(_tbl,'id',it.id); save(); renderConfig(); toast('Eliminado');
}

function guardarRubro(k){
  const nom=val('rNom').trim(); if(!nom){toast('⚠ Falta el nombre');return;}
  const data={nom,em:val('rEm')||'📦',color:val('rColor')};
  if(k){CONFIG.cats[k]=Object.assign(CONFIG.cats[k]||{},data);}
  else{let key=slug(nom)||uid('r'); if(CONFIG.cats[key])key=uid('r'); CONFIG.cats[key]=data;}

function borrarRubro(k){
  const uso=PRODUCTS.filter(pr=>pr.cat===k).length;
  if(uso){toast('⚠ Hay '+uso+' producto(s) en este rubro. Reasignalos primero.');return;}

function togglePromo(i){const pr=CONFIG.promos[i];if(!pr)return;pr.activo=(pr.activo===false);save();renderConfig();renderChips();renderProducts();}
function borrarPromo(i){const pr=CONFIG.promos[i];if(!pr)return;if(!confirm('¿Borrar la promo "'+pr.nombre+'"?'))return;if(cloudStaff()){sbDelete('promo_items','promo_id',pr.id);sbDelete('promos','id',pr.id);}CONFIG.promos.splice(i,1);save();renderConfig();renderChips();renderProducts();toast('Promo borrada');}
function editPromo(id){
  if(!CONFIG.promos)CONFIG.promos=[];
  const src=id?promoById(id):null;
  state.promoEdit = src
    ? {id:src.id,nombre:src.nombre,em:src.em||'🎁',desc:src.desc||'',activo:src.activo!==false,precio:src.precio,items:(src.items||[]).map(x=>Object.assign({},x))}
    : {id:null,nombre:'',em:'🎁',desc:'',activo:true,precio:'',items:[]};
  promoRender();
}
function pmGrab(){
  const pe=state.promoEdit; if(!pe)return;
  if(document.getElementById('pmNom'))pe.nombre=val('pmNom');
  if(document.getElementById('pmEm'))pe.em=val('pmEm');
  if(document.getElementById('pmDesc'))pe.desc=val('pmDesc');
  if(document.getElementById('pmPrecio'))pe.precio=val('pmPrecio');
  if(document.getElementById('pmActivo'))pe.activo=val('pmActivo')==='1';
}
function promoRender(){
  const pe=state.promoEdit; if(!pe)return;
  const prods=PRODUCTS.filter(p=>p.activo||pe.items.some(it=>it.id===p.id));
  const opt=sel=>prods.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${p.em} ${esc(p.nombre)} — ${money(p.precio)}</option>`).join('');
  const rows=pe.items.map((it,idx)=>{
    const p=prodById(it.id),u=p?(UNIDADES[p.unidad]||UNIDADES.un):UNIDADES.un;
    return `<div class="list-row" style="align-items:flex-start">
      <div class="grow">
        <select onchange="pmSwap(${idx},this.value)" style="width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper-2);color:var(--ink)">${opt(it.id)}</select>
        <div class="mini-qty" style="margin-top:8px">
          <button onclick="pmQty(${idx},-1)">−</button><span>${u.fmt(it.qty)}</span><button onclick="pmQty(${idx},1)">＋</button>
          <button class="link-del" style="margin-left:auto" onclick="pmDel(${idx})">Quitar</button>
        </div>
      </div>
    </div>`;
  }).join('');
  const lista=pe.items.reduce((s,it)=>{const p=prodById(it.id);return s+(p?p.precio*it.qty:0);},0);
  const ahorro=Math.max(0,lista-(parseFloat(pe.precio)||0));
  const addOpts=PRODUCTS.filter(p=>p.activo).map(p=>`<option value="${p.id}">${p.em} ${esc(p.nombre)} — ${money(p.precio)}</option>`).join('');
  openModal(`
    <h3>${pe.id?'Editar promo':'Nueva promo'}</h3>
    <div class="seg" style="margin-bottom:13px">
      <div class="field" style="margin:0"><label>Nombre</label><input id="pmNom" value="${esc(pe.nombre)}"></div>
      <div class="field" style="margin:0"><label>Emoji</label><input id="pmEm" value="${esc(pe.em)}" maxlength="4"></div>
    </div>
    <div class="field"><label>Descripción corta</label><input id="pmDesc" value="${esc(pe.desc)}"></div>
    <label class="hint" style="display:block;margin-bottom:6px">Productos del combo</label>
    <div style="max-height:32vh;overflow:auto;margin-bottom:8px">${rows||'<div class="empty" style="padding:14px">Agregá productos al combo 👇</div>'}</div>
    <div class="field"><label>Agregar producto</label>
      <div style="display:flex;gap:8px">
        <select id="pmAddSel" style="flex:1;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:var(--paper-2);color:var(--ink)">${addOpts}</select>
        <button class="btn btn-ghost" style="width:auto;padding:0 16px" onclick="pmAdd()">＋</button>
      </div>
    </div>
    <div class="sum-row"><span>Precio de lista (sumado)</span><b>${money(lista)}</b></div>
    <div class="seg" style="margin-bottom:6px">
      <div class="field" style="margin:0"><label>Precio de la promo ($)</label><input id="pmPrecio" type="number" value="${pe.precio}" oninput="pmPrice()"></div>
      <div class="field" style="margin:0"><label>¿En portada?</label><select id="pmActivo"><option value="1" ${pe.activo?'selected':''}>Sí</option><option value="0" ${!pe.activo?'selected':''}>No</option></select></div>
    </div>
    <div class="hint" id="pmAhorro">${ahorro>0?('Ahorro: '+money(ahorro)):'Poné un precio menor al de lista para mostrar el ahorro.'}</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-ghost" onclick="state.promoEdit=null;cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarPromo()">Guardar promo</button>
    </div>
  `,true);
}
function pmPrice(){
  pmGrab(); const pe=state.promoEdit; if(!pe)return;
  const lista=pe.items.reduce((s,it)=>{const p=prodById(it.id);return s+(p?p.precio*it.qty:0);},0);
  const a=Math.max(0,lista-(parseFloat(pe.precio)||0));
  const el=document.getElementById('pmAhorro'); if(el)el.textContent=a>0?('Ahorro: '+money(a)):'Poné un precio menor al de lista para ver el ahorro.';
}
function pmSwap(idx,pid){pmGrab();const p=prodById(pid);if(!p)return;const it=state.promoEdit.items[idx];const u=UNIDADES[p.unidad]||UNIDADES.un;it.id=p.id;if(it.qty<u.min)it.qty=u.min;promoRender();}
function pmQty(idx,dir){pmGrab();const it=state.promoEdit.items[idx];const p=prodById(it.id);const u=p?(UNIDADES[p.unidad]||UNIDADES.un):UNIDADES.un;let q=Math.round(((it.qty||0)+dir*u.step)*100)/100;if(q<u.min)q=u.min;it.qty=q;promoRender();}
function pmDel(idx){pmGrab();state.promoEdit.items.splice(idx,1);promoRender();}
function pmAdd(){pmGrab();const pid=val('pmAddSel');const p=prodById(pid);if(!p)return;const u=UNIDADES[p.unidad]||UNIDADES.un;const ex=state.promoEdit.items.find(x=>x.id===pid);if(ex)ex.qty=Math.round((ex.qty+u.step)*100)/100;else state.promoEdit.items.push({id:pid,qty:u.min});promoRender();}
function guardarPromo(){
  pmGrab(); const pe=state.promoEdit; if(!pe)return;
  if(!pe.nombre.trim()){toast('⚠ Falta el nombre');return;}
  if(!pe.items.length){toast('⚠ Agregá al menos un producto');return;}
  const precio=parseFloat(pe.precio)||0; if(!(precio>0)){toast('⚠ Precio inválido');return;}
  const data={nombre:pe.nombre.trim(),em:pe.em||'🎁',desc:(pe.desc||'').trim(),activo:!!pe.activo,precio,items:pe.items.map(x=>({id:x.id,qty:x.qty}))};
  if(!CONFIG.promos)CONFIG.promos=[];
  if(pe.id){Object.assign(promoById(pe.id),data);}
  else{data.id=uid('promo');CONFIG.promos.push(data);}
  const _pid=pe.id||data.id; if(cloudStaff())sbDelete('promo_items','promo_id',_pid);
  state.promoEdit=null;cerrarModal();save();renderConfig();renderChips();renderProducts();toast('✓ Promo guardada');
}

function qrSrc(url){ return 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=10&data='+encodeURIComponent(url); }
function renderQR(){
  const box=document.getElementById('qrBox'); if(!box)return;
  box.innerHTML=`<img src="${qrSrc(shareURL())}" alt="QR de la tienda" width="200" height="200" style="border-radius:12px;background:#fff;padding:8px;border:1px solid var(--line)" onerror="this.parentNode.innerHTML='<div class=&quot;hint&quot;>No se pudo generar el QR (¿sin internet?).</div>'">`;
}
function copiarLink(){
  const url=shareURL();
  const done=()=>toast('✓ Link copiado');
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done)); }
  else fallbackCopy(url,done);
}
function fallbackCopy(text,cb){ try{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();cb&&cb();}catch(e){toast('Copiá manualmente: '+text);} }

function exportJSON(){
  const data={config:CONFIG,products:PRODUCTS,orders:ORDERS,seq:ORDER_SEQ,clientes:CLIENTES,users:USERS,theme:state.theme,_exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(slug(CONFIG.nombre)||'almacen')+'_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('⬇ Backup exportado');
}
function importJSON(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw 0;
      if(!confirm('Esto reemplaza TODOS los datos actuales por los del archivo. ¿Continuar?')){input.value='';return;}
      if(d.config)CONFIG=d.config;
      if(d.products)PRODUCTS=d.products;
      if(d.orders)ORDERS=d.orders;
      if(typeof d.seq==='number')ORDER_SEQ=d.seq;
      if(d.clientes)CLIENTES=d.clientes;
      if(d.users&&d.users.length)USERS=d.users;
      if(d.theme)state.theme=d.theme;
      save(); applyTheme(); renderStoreChrome(); renderChips(); renderProducts(); renderAdmin();
      toast('✓ Datos importados');
    }catch(e){toast('⚠ Archivo JSON inválido');}
    input.value='';
  };
  r.readAsText(f);
}
function plantillaExcel(){
  if(!window.XLSX){toast('⚠ No cargó la librería de Excel');return;}
  const rows=[
    {nombre:'Ejemplo queso',rubro:'fiambreria',precio:12000,unidad:'kg',emoji:'🧀',descripcion:'Producto de ejemplo',activo:'si'},
    {nombre:'Ejemplo fideos',rubro:'almacen',precio:1400,unidad:'un',emoji:'🍝',descripcion:'',activo:'si'},
  ];
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Productos');
  XLSX.writeFile(wb,'plantilla_productos.xlsx');
}
function importarExcel(input){
  const f=input.files&&input.files[0]; if(!f)return;
  if(!window.XLSX){toast('⚠ No cargó la librería de Excel');input.value='';return;}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const wb=XLSX.read(r.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{defval:''});
      const catKeys=Object.keys(CONFIG.cats);
      const findCat=v=>{v=String(v).trim().toLowerCase(); if(CONFIG.cats[v])return v; const k=catKeys.find(k=>CONFIG.cats[k].nom.toLowerCase()===v); return k||catKeys[0];};
      const findUni=v=>{v=String(v).trim().toLowerCase(); if(UNIDADES[v])return v; if(v.includes('kg'))return 'kg'; if(v.includes('doc'))return 'doc'; return 'un';};
      let n=0;
      data.forEach(row=>{
        const get=(...ks)=>{for(const key of Object.keys(row)){if(ks.includes(key.trim().toLowerCase()))return row[key];}return '';};
        const nombre=String(get('nombre','producto','name')).trim(); if(!nombre)return;
        const precio=parseFloat(String(get('precio','price')).replace(/[^0-9.,]/g,'').replace(',','.'))||0;
        const act=String(get('activo','disponible')).trim().toLowerCase();
        PRODUCTS.push({
          id:uid('p'), nombre,
          cat:findCat(get('rubro','categoria','cat')),
          precio, unidad:findUni(get('unidad','unit')),
          em:String(get('emoji','em')||'🛒').slice(0,4),
          desc:String(get('descripcion','desc','detalle')).trim(),
          activo:['no','false','0','inactivo'].includes(act)?false:true
        });
        n++;
      });
      save(); renderProducts(); renderConfig();
      toast(n?('✓ '+n+' producto(s) importado(s)'):'⚠ No se encontraron filas válidas');
    }catch(e){toast('⚠ No se pudo leer el Excel');}
    input.value='';
  };
  r.readAsArrayBuffer(f);
}

/* ============================================================
   Init
   ============================================================ */
(async function init(){
  let cloud=false;
  if(cloudEnabled()){
    try{ cloud = await cloudLoad(); }catch(e){ console.error(e); cloud=false; }
    if(cloud){ console.log('☁ Catálogo cargado desde Supabase'); await restaurarSesion(); }
    else { toast('⚠ Sin conexión a la nube: uso datos locales'); }
  }
  if(!cloud){ const hadDB=loadDB(); normalizeConfig(); if(!hadDB){/* seeds ya cargadas */} }
  // preferencia de tema (siempre local, es del dispositivo)
  try{const st=localStorage.getItem('almacen_theme');if(st&&themeById(st).id===st)state.theme=st;}catch(e){}
  applyTheme();
  renderStoreChrome();
  renderChips();
  renderProducts();
  refreshCartUI();
  renderStoreStatus();
  try{ if(window.matchMedia){ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if((CONFIG.ui||{}).autoDark==='system')applyTheme(); }); } }catch(e){}
  setInterval(()=>{ if((CONFIG.ui||{}).autoDark==='night')applyTheme(); renderStoreStatus(); renderStoreChrome(); }, 120000);
})();
</script>
